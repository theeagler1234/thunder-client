name: Deploy playable game to GitHub Pages

on:
  push:
    branches:
      - main
      - pages-deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore verified WasmGC build cache
        uses: actions/cache@v4
        with:
          path: |
            game/build
            platform/build
            platform-teavm/build
            teavm-compat/build
            target_lwjgl_desktop/build/epk
            target_teavm/build
            target_teavm_wasm_gc/build
            target_teavm_wasm_gc_mesh/build
            target_teavm_wasm_gc_server/build
            wasm-toolchain/generated
          key: fig-pages-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/src/**', '**/*.gradle.kts', '**/*.properties', 'gradle/**', 'wasm-toolchain/**/*.js', 'wasm-toolchain/**/*.java', 'wasm-toolchain/**/*.sh', 'package-lock.json') }}
          restore-keys: |
            fig-pages-${{ runner.os }}-${{ github.ref_name }}-

      - name: Install web packaging dependency
        run: npm ci

      - name: Build self-contained game page
        env:
          EAGLER_BUILD_CAP_MIB: "13312"
          EAGLER_LINK_HEAP_MIB: "10240"
          EAGLER_SERVER_LINK_HEAP_MIB: "12544"
        run: |
          mkdir -p _site
          node wasm-toolchain/build-single-html.js --output _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
