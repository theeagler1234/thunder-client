# Eaglercraft 26.2 — Low-Memory Optimized Gradle Properties
# Reduces RAM usage for compilation and TeaVM linking

# JVM args for Gradle daemon - LOWER memory
# -Xmx2G: 2GB heap (reduced from 4GB)
# -Xss4m: 4MB stack size (reduced from 8MB)
# -XX:MaxMetaspaceSize=512m: Lower Metaspace limit
# -XX:+UseSerialGC: Serial GC uses LESS memory than G1/ZGC
org.gradle.jvmargs=-Xmx2048m -Xss4m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:-UseCompressedOops

# Build cache: enabled but local only
org.gradle.caching=true

# Parallel project execution: DISABLED to reduce peak memory
# Set to true only if you have >16GB RAM
org.gradle.parallel=false

# Maximum worker processes: 1 to reduce memory
org.gradle.workers.max=1

# Configuration cache: enabled
org.gradle.configuration-cache=true

# Daemon idle timeout: shorter to release memory faster
org.gradle.daemon.idletimeout=300000

# Disable VFS watching to save memory
org.gradle.vfs.watch=false

# TeaVM-specific: Java release version for bytecode compatibility
# TeaVM 0.13 supports up to Java 24 classfiles (classfile version 68)
eaglerJavaRelease=24

# Development mode flags (can be overridden with -P)
eaglerFastLink=true
eaglerPerfDiagnostic=false
eaglerIncrementalSimple=true