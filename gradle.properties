# Ordinary javac tasks peak around 1.4-2.3 GiB in this workspace (the original
# project measured this). Expensive TeaVM links do not use this setting: they run
# in their own JVM sized by wasm-toolchain/memory-plan.js. Keep this daemon heap
# small so a one-off Gradle run never reserves release-build memory.
#
# 3 GiB leaves headroom above that javac peak. Serial GC has a smaller native
# footprint than G1, which matters on machines with under 16 GiB of RAM.
# Do not add -XX:-UseCompressedOops here: it makes every object reference twice
# as large and raises, not lowers, memory use.
org.gradle.jvmargs=-Xmx3072m -Xss8m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1

# Release the daemon quickly and skip file-system watching (extra memory).
org.gradle.daemon.idletimeout=300000
org.gradle.vfs.watch=false

# Intentionally NOT set here:
#  - org.gradle.configuration-cache: the printStandaloneClasspaths and
#    printWasmGCClasspath tasks read project state when they run, which the
#    configuration cache does not support.
#  - eaglerFastLink / eaglerPerfDiagnostic / eaglerIncrementalSimple: these turn
#    the Gradle WasmGC task into a non-release build. Pass them with -P when you
#    really want a local fast-link build.
